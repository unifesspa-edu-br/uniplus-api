# Servidor KES da POC. As variáveis ${...} vêm de .estado/env, gerado por scripts/subir.sh.
version: v1
address: 0.0.0.0:7373

admin:
  identity: disabled

tls:
  key: /certs/kes.key
  cert: /certs/kes.crt

# Cache curto de propósito: a prova de falha fechada (Vault selado) não pode esperar minutos.
cache:
  expiry:
    any: 30s
    unused: 10s
    offline: 0s

log:
  error: on
  audit: on

# Só a identidade do MinIO usa a chave dos arquivos do candidato, e só para criar, gerar e decifrar
# chaves de dados. A identidade "sem permissão" das provas não aparece aqui.
policy:
  minio:
    allow:
      - /v1/key/create/uniplus-arquivos-candidato
      - /v1/key/generate/uniplus-arquivos-candidato
      - /v1/key/decrypt/uniplus-arquivos-candidato
      - /v1/key/bulk/decrypt/uniplus-arquivos-candidato
      - /v1/key/list/*
      - /v1/status
      - /v1/metrics
      - /v1/log/audit
      - /v1/log/error
    identities:
      - ${KES_IDENTIDADE_MINIO}

keystore:
  vault:
    endpoint: http://vault:8200
    engine: kv
    version: v2
    prefix: kes
    approle:
      engine: approle
      id: ${KES_VAULT_ROLE_ID}
      secret: ${KES_VAULT_SECRET_ID}
    transit:
      engine: transit
      key: uniplus-kes-kek
    status:
      ping: 10s
