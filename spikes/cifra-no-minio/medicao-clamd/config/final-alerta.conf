LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
DatabaseDirectory /var/lib/clamav
# medição: sem cache de veredicto, para cada envio ser varrido de verdade
DisableCache yes
MaxRecursion 16
MaxFiles 10000
MaxThreads 4
IdleTimeout 600
HeuristicAlerts yes
ScanArchive yes
ScanMail yes
ScanPE yes
ScanELF yes
ScanPDF yes
ScanXMLDOCS yes
ScanHWP3 yes
# configuração aprovada em 23/10/2026, com a recarga concorrente (a bloqueante trava o clamd sob carga),
# recusando o que passa dos limites de varredura em vez de responder OK sem varrer o resto
MaxFileSize 25M
MaxScanSize 100M
StreamMaxLength 25M
DetectPUA no
AlertEncrypted no
ConcurrentDatabaseReload yes
AlertExceedsMax yes
