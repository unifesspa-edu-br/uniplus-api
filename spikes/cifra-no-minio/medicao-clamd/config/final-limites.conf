LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
DatabaseDirectory /var/lib/clamav
# medição: sem cache de veredicto, para cada envio ser varrido de verdade
DisableCache yes
MaxRecursion 16
MaxFiles 10000
MaxThreads 4
IdleTimeout 600
HeuristicAlerts yes
ScanArchive yes
ScanMail yes
ScanPE yes
ScanELF yes
ScanPDF yes
ScanXMLDOCS yes
ScanHWP3 yes
# a final-alerta com limites de tamanho folgados, sem PUA e com o MaxFiles padrão (10000), que
# recusa o PDF de texto de 20 MB com mais de 10 mil páginas; recarga concorrente (a bloqueante
# trava o clamd sob carga) e recusa do que passa dos limites
MaxFileSize 100M
MaxScanSize 400M
StreamMaxLength 25M
DetectPUA no
AlertEncrypted no
ConcurrentDatabaseReload yes
AlertExceedsMax yes
