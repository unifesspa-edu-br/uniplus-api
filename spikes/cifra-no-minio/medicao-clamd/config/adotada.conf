LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
DatabaseDirectory /var/lib/clamav
# medição: sem cache de veredicto, para cada envio ser varrido de verdade
DisableCache yes
MaxRecursion 16
MaxFiles 50000
MaxThreads 4
IdleTimeout 600
HeuristicAlerts yes
ScanArchive yes
ScanMail yes
ScanPE yes
ScanELF yes
ScanPDF yes
ScanXMLDOCS yes
ScanHWP3 yes
# configuração adotada em 24/10/2026: PUA ligada, com as duas assinaturas de JavaScript em PDF
# ignoradas (pua-ignoradas.ign2); recarga concorrente (a bloqueante trava o clamd sob carga),
# MaxFiles folgado para o PDF de texto de 20 MB com mais de 10 mil páginas, alerta do arquivo
# compactado cifrado dentro do envio (o PDF com senha só de proprietário segue), recusa do que
# passa dos limites e limites folgados, para que o arquivo legítimo de até 20 MB seja varrido por inteiro
MaxFileSize 100M
MaxScanSize 400M
StreamMaxLength 25M
DetectPUA yes
AlertEncryptedArchive yes
AlertEncryptedDoc no
ConcurrentDatabaseReload yes
AlertExceedsMax yes
