LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
DatabaseDirectory /var/lib/clamav
# medição: sem cache de veredicto, para cada envio ser varrido de verdade
DisableCache yes
MaxRecursion 16
MaxFiles 10000
MaxThreads 4
IdleTimeout 600
HeuristicAlerts yes
ScanArchive yes
ScanMail yes
ScanPE yes
ScanELF yes
ScanPDF yes
ScanXMLDOCS yes
ScanHWP3 yes
# chart apps/clamav-scanner em HML
MaxFileSize 100M
MaxScanSize 400M
DetectPUA yes
