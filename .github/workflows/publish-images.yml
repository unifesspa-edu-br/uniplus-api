name: Publish Images

# Publica imagens das APIs no GitHub Container Registry conforme ADR-0050.
#
# Trigger único: push em tag v* (ex.: v0.1.0). Push em main NÃO publica —
# disciplina de release explícito, sem rolling tag mutável. Tags devem
# apontar para commits em main (operacional, não enforçado pelo workflow).
#
# Tags publicadas para cada release v<X>.<Y>.<Z>:
#   - sha-<7>             identidade imutável do commit
#   - v<X>.<Y>.<Z>        release exata (imutável)
#   - v<X>.<Y>            pin de minor (rola com patches)
#   - v<X>                pin de major (rola com minors+patches)
#
# Sem `latest`, sem `main` — ArgoCD pina semver, devs usam compose local
# com build-by-context.
#
# Imagens publicadas: uma por docker/Dockerfile.<módulo>, com a matriz
# derivada pelo job `discover` (mesma fonte de verdade do trivy.yml):
#   - ghcr.io/<owner>/uniplus-api-<módulo>
# Hoje: selecao, ingresso, portal, organizacao, configuracao.
#
# Arquitetura: cada tag acima é publicada apenas para linux/amd64, que é
# o que os clusters do projeto executam. O alvo arm64 saiu daqui porque
# custava cross-build por emulação QEMU a cada release sem que nada
# puxasse o layer produzido; se a migração para ARM (Epic
# uniplus-infra#317) for retomada, é aqui que a plataforma volta.
# Smoke runtime real (com sidecar Postgres/Kafka/Redis) acontece em
# compose/Helm pós-publish.

on:
  push:
    tags:
      # Glob: aceita prefix `v` seguido de 3 partes ponto-separadas.
      # Filtro fino (somente dígitos) é validado no step `Validar formato`.
      - 'v*.*.*'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  # Tags semver são imutáveis; o concurrency aqui só protege contra dois
  # workflows tentando publicar a MESMA tag por race condition (force-push).
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Descobrir módulos (Dockerfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      modules: ${{ steps.list.outputs.modules }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Listar módulos a partir de docker/Dockerfile.*
        id: list
        # Fonte única de verdade: cada docker/Dockerfile.<módulo> vira um item
        # da matriz `publish`, idêntico ao discover do trivy.yml. Nascer um
        # Dockerfile novo já o publica, sem editar este workflow nem manter
        # sincronia manual com o scan Trivy (CA-04 da issue #630).
        run: |
          set -euo pipefail
          modules=$(ls docker/Dockerfile.* | sed 's#.*Dockerfile\.##' | sort | jq -R . | jq -cs .)
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "Módulos descobertos: $modules"

  publish:
    name: Publish ${{ matrix.module }}
    needs: discover
    runs-on: ubuntu-latest
    # 60min: a matriz é única pra todos os módulos, mas `host` (composition
    # root que bundla Selecao/Ingresso/Configuração/OrganizacaoInstitucional/
    # Publicações/Discentes) é ordens de grandeza maior que os demais.
    # 30min estourou no meio do push do `host` na v0.5.0 (primeira release
    # cortada depois do módulo crescer pra esse tamanho); `portal` sozinho
    # terminava em ~15min, bem dentro do limite antigo. A folga permanece
    # porque o teto é do módulo maior, não da arquitetura.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Matriz derivada de docker/Dockerfile.* pelo job `discover` — mesma
        # fonte de verdade do trivy.yml. Sem lista hard-coded para sincronizar.
        module: ${{ fromJSON(needs.discover.outputs.modules) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # fetch-depth=0 traz o histórico completo necessário para
          # `git merge-base --is-ancestor` no step de validação abaixo.
          fetch-depth: 0

      - name: Validar formato semver da tag
        # ADR-0050 exige tags `v<X>.<Y>.<Z>` com X/Y/Z numéricos. O glob no
        # trigger filtra por estrutura (3 partes ponto-separadas), mas aceita
        # `v1.2.x`, `v1.0.0-rc1`, `vfoo.bar.baz`, etc. Esta regex restringe
        # a SemVer puro. Roda antes do `git fetch` por ser muito mais barato
        # — falha cedo em tags malformadas sem custo de rede.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG' não segue o padrão v<X>.<Y>.<Z> exigido pela ADR-0050."
            echo "::error::Tags pré-release (v1.0.0-rc1) ou genéricas (vtest) não publicam imagem."
            exit 1
          fi
          echo "✓ Tag em formato semver: $TAG"

      - name: Validar que a tag aponta para commit em main
        # ADR-0050 exige que toda imagem publicada venha de commit já
        # mergeado em main. Sem este gate, um operador poderia tagear um
        # commit de feature branch e publicar silenciosamente. Falha cedo
        # antes de qualquer build.
        #
        # `${GITHUB_REF}^{commit}` peel o tag object para o commit subjacente.
        # Em tags anotadas (`git tag -a`) o ref aponta para um tag object
        # cuja SHA difere do commit alvo; o `^{commit}` resolve para o commit.
        # Em tags lightweight (`git tag`) o ref já aponta para o commit e o
        # peel é noop. `$GITHUB_SHA` funciona para os dois mas é menos
        # explícito sobre intenção.
        #
        # `git fetch origin main` sem `--depth` preserva o histórico completo
        # já trazido pelo `actions/checkout fetch-depth: 0` acima. Adicionar
        # `--depth=1` reverteria origin/main para shallow e quebraria
        # `merge-base --is-ancestor` em tags pointing para commits antigos
        # legítimos de main (false negative).
        run: |
          set -euo pipefail
          git fetch origin main
          TAG_COMMIT=$(git rev-parse "${GITHUB_REF}^{commit}")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} aponta para commit $TAG_COMMIT fora de origin/main."
            echo "::error::Tags v* só podem ser aplicadas a commits já mergeados em main (ADR-0050)."
            exit 1
          fi
          echo "✓ Tag aponta para commit em main: $TAG_COMMIT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/uniplus-api-${{ matrix.module }}
          # O checkout completo já contém os metadados Git necessários.
          # Assim, a release não depende da API GitHub para a data do commit
          # (contexto workflow), sem alterar a identidade da tag ou do SHA.
          context: git
          # Política de tagging: ver ADR-0050.
          # - sha-<7>          : identidade imutável do commit (sempre)
          # - v<X>.<Y>.<Z>     : release exata (imutável)
          # - v<X>.<Y>         : pin de minor (rola com patches)
          # - v<X>             : pin de major (rola com minors+patches)
          # Sem `latest` e sem `main` — disciplina semver explícita.
          flavor: |
            latest=false
          # `github.ref_name` é a tag do evento, fonte explícita para SemVer.
          # Isso preserva o contexto Git para a data do commit sem depender
          # das demais refs que também decoram o HEAD.
          # Patterns prefixadas com `v` literal — `{{version}}` remove o `v`.
          tags: |
            type=sha,format=short,prefix=sha-
            type=semver,pattern=v{{version}},value=${{ github.ref_name }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern=v{{major}},value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=uniplus-api-${{ matrix.module }}
            org.opencontainers.image.description=Módulo ${{ matrix.module }} da API do Uni+ (Sistema Unificado Unifesspa)
            org.opencontainers.image.vendor=Universidade Federal do Sul e Sudeste do Pará (Unifesspa)
            org.opencontainers.image.licenses=AGPL-3.0-or-later

      # Build em duas fases para validar ANTES de tornar a tag pública:
      # 1. Build com push=false e load=true → imagem fica no daemon Docker local
      # 2. Smoke test contra a imagem local (liveness probe)
      # 3. Build com push=true → reusa cache, publica no GHCR após smoke verde
      #
      # O cache GHA torna o segundo build praticamente instantâneo (ele só
      # exporta o manifest para o registry; layers já estão no GHA cache).
      # Sem isso, uma imagem que falhe no smoke já estaria publicada como
      # v<X>.<Y>.<Z> imutável no GHCR.

      - name: Build local (sem push) para smoke
        id: build_local
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.module }}
          # O `load: true` do buildx só funciona com uma plataforma por vez
          # (carrega no daemon Docker local para `docker create`/`docker run`),
          # e é a mesma que o push publica — o smoke exercita exatamente o
          # que vai para o registry.
          platforms: linux/amd64
          push: false
          load: true
          tags: smoke/uniplus-api-${{ matrix.module }}:ci
          # Cache scoped por módulo: builds independentes não invalidam
          # cache uns dos outros, e o cache deste smoke é reaproveitado
          # integralmente pelo push a seguir.
          cache-from: type=gha,scope=${{ matrix.module }}-amd64
          cache-to: type=gha,scope=${{ matrix.module }}-amd64,mode=max

      - name: Smoke test — validação estrutural da imagem
        # Smoke runtime (/health/live) não é viável em CI puro: Wolverine valida
        # `ConnectionStrings:*Db` ao construir o host, então o app crasha em
        # startup sem Postgres real. Em vez de prover sidecar Postgres/Kafka/Redis
        # no workflow (overhead alto, custo cumulativo na matriz), validamos a
        # estrutura da imagem antes do push:
        #   - Imagem é loadable (manifest + layers íntegros, `docker create` ok)
        #   - Roda como usuário não-root (não pode ser '' nem 'root')
        #   - Entrypoint referencia uma DLL `Unifesspa.UniPlus`
        #   - Runtime .NET responde a `dotnet --info`
        # Smoke runtime real é exercido em compose/Helm pós-publish.
        run: |
          set -euo pipefail
          IMAGE_REF="smoke/uniplus-api-${{ matrix.module }}:ci"
          echo "Smoke (structural): $IMAGE_REF"

          docker create --name "smoke-${{ matrix.module }}" "$IMAGE_REF" >/dev/null

          USER_FIELD=$(docker inspect -f '{{.Config.User}}' "smoke-${{ matrix.module }}")
          # USER pode ser: '' (default root), 'root', 'root:gid', '0' (uid root),
          # '0:0' / '0:N' (uid root + qualquer gid). Todos significam root.
          case "$USER_FIELD" in
            ""|"root"|"root:"*|"0"|"0:"*)
              echo "::error::Imagem roda como root ou USER não definido (got: '$USER_FIELD')"
              docker rm "smoke-${{ matrix.module }}" >/dev/null
              exit 1
              ;;
          esac
          echo "✓ Non-root user: $USER_FIELD"

          ENTRYPOINT=$(docker inspect -f '{{.Config.Entrypoint}}' "smoke-${{ matrix.module }}")
          if ! echo "$ENTRYPOINT" | grep -qi "Unifesspa.UniPlus"; then
            echo "::error::Entrypoint não referencia DLL Unifesspa.UniPlus (got: $ENTRYPOINT)"
            docker rm "smoke-${{ matrix.module }}" >/dev/null
            exit 1
          fi
          echo "✓ Entrypoint: $ENTRYPOINT"

          docker rm "smoke-${{ matrix.module }}" >/dev/null

          # Não pipear `head -N` aqui: com set -euo pipefail, head fechando o
          # pipe cedo gera SIGPIPE no docker run (exit 141), que pipefail
          # propaga como falha do step — bloqueia publish mesmo com runtime
          # saudável. Saída de `dotnet --info` é verbose (~30 linhas) e o
          # exit code já é o sinal que precisamos. Descartamos stdout.
          docker run --rm --entrypoint /usr/bin/dotnet "$IMAGE_REF" --info >/dev/null
          echo "✓ Runtime .NET responde"

      - name: Push para GHCR (após smoke verde)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.module }}
          # Uma plataforma só: ArgoCD puxa o mesmo
          # `ghcr.io/.../uniplus-api-<module>:vX.Y.Z` em qualquer cluster do
          # projeto, todos amd64. O build reusa integralmente o cache do
          # step de smoke, que roda na mesma arquitetura.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Mesmo scope do smoke: sem segunda arquitetura, não há
          # invalidação cruzada a evitar.
          cache-from: type=gha,scope=${{ matrix.module }}-amd64
          cache-to: type=gha,scope=${{ matrix.module }}-amd64,mode=max

      - name: Resumo
        if: always()
        run: |
          echo "### Publish: \`uniplus-api-${{ matrix.module }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Plataforma:** \`linux/amd64\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags publicadas:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
