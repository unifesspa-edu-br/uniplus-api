name: CodeQL

# Análise estática de segurança (SAST) do código C# / .NET 10. Resultados
# alimentam a aba Security do GitHub via upload SARIF do passo `analyze`.
# Issue #23: adoção de CodeQL como gate inicial não bloqueante (alerta);
# elevação para required check fica para fase futura quando a baseline de
# findings estiver triada.

on:
  push:
    branches: [main]
    # paths-ignore evita execução em PRs/pushes docs-only (sem código C#
    # alterado, CodeQL não acrescenta sinal). O schedule semanal abaixo
    # cobre drift acidental.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  schedule:
    # Segunda-feira 03:30 UTC (= 00:30 BRT). Janela noturna de baixo tráfego
    # nos GitHub Actions runners e fora do horário operacional do time.
    - cron: '30 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # A compilação explícita mantém a extração do código gerado.
          - language: csharp
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          # Cache de packages NuGet chaveado por hash dos .csproj. Reduz
          # restore frio (~30-60s na árvore atual de ~30 projetos) para
          # ~5s em cache hit, economizando runner minutes em PRs em rajada.
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build production projects
        run: |
          # Todo projeto de src/ entra, inclusive os que não são dependência
          # dos hosts; os projetos de teste ficam fora da análise de segurança.
          dotnet new sln --name producao --output "$RUNNER_TEMP" --format slnx
          find src -name '*.csproj' -print0 | xargs -0 dotnet sln "$RUNNER_TEMP/producao.slnx" add
          dotnet restore "$RUNNER_TEMP/producao.slnx"
          dotnet build "$RUNNER_TEMP/producao.slnx" \
            --configuration Release \
            --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
