replicaCount: 2

image:
  repository: registry.unifesspa.edu.br/uniplus/portal-api
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080

# Origens confiáveis para a política de CORS. Em ASPNETCORE_ENVIRONMENT
# diferente de Development, AddCorsConfiguration().ValidateOnStart() rejeita
# lista vazia — sem ao menos uma entrada o pod crashloopa no startup.
# Cada item vira a env var Cors__AllowedOrigins__<i> via ConfigMap.
cors:
  allowedOrigins: []

# Redes de onde o proxy que termina o TLS alcanca a aplicacao, em notacao CIDR.
# Fora de Development, AddReverseProxyConfiguration().ValidateOnStart() rejeita
# lista vazia — sem ao menos uma entrada o pod crashloopa no startup.
# So X-Forwarded-Proto e honrado, e apenas vindo destas redes: sem isso a
# aplicacao enxerga http atras do TLS terminado e emite Link e Location com o
# scheme errado. Cada item vira a env var ReverseProxy__TrustedNetworks__<i>.
reverseProxy:
  trustedNetworks: []

# Origens que a pagina publica do certame compoe (ADR-0131): o contrato publico
# de leitura do certame (Selecao) e a consulta unificada de atos (Publicacoes).
# Ambas sao servidas pelo deployable monolitico, sem credencial. Endereco base,
# sem caminho — ex.: http://<release-do-monolito>-uniplus-api. Sem
# selecaoBaseUrl, a Portal sobe sem a composicao e a rota
# /api/portal/certames/{identificador} fica sem como responder; com ele, a
# configuracao inteira e validada na subida. Cada chave vira a env var
# Origens__<Chave> via ConfigMap.
origens:
  selecaoBaseUrl: ""
  publicacoesBaseUrl: ""
  # Segundos do Retry-After da resposta 503 quando Selecao esta indisponivel.
  reencaminharAposEmSegundos: 15

secrets:
  connectionString: ""
  redisConnection: ""
  kafkaBootstrapServers: ""
  storageEndpoint: ""
  storageAccessKey: ""
  storageSecretKey: ""
  authAuthority: ""

healthcheck:
  # Liveness usa endpoint dependency-free (sem checks externos) para evitar
  # restart loops quando OIDC/DB/Kafka oscilam — apenas confirma que o
  # processo .NET continua respondendo. Readiness usa o /health agregado
  # com todos os checks (OIDC, Postgres, Kafka, Redis), removendo o pod
  # do Service quando dependência transitória cai sem reiniciá-lo.
  livenessPath: /health/live
  readinessPath: /health
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
