apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-portal-config
  labels:
    app: {{ .Release.Name }}-portal-api
    app.kubernetes.io/name: uniplus-portal
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.env.ASPNETCORE_ENVIRONMENT }}
  ASPNETCORE_URLS: {{ .Values.env.ASPNETCORE_URLS }}
  {{- range $index, $origin := .Values.cors.allowedOrigins }}
  Cors__AllowedOrigins__{{ $index }}: {{ $origin | quote }}
  {{- end }}
  {{- range $index, $network := .Values.reverseProxy.trustedNetworks }}
  ReverseProxy__TrustedNetworks__{{ $index }}: {{ $network | quote }}
  {{- end }}
  Origens__SelecaoBaseUrl: {{ required "origens.selecaoBaseUrl e obrigatorio: a Portal nao sobe sem o endereco de Selecao" .Values.origens.selecaoBaseUrl | quote }}
  Origens__PublicacoesBaseUrl: {{ required "origens.publicacoesBaseUrl e obrigatorio: a Portal nao sobe sem o endereco de Publicacoes" .Values.origens.publicacoesBaseUrl | quote }}
  Origens__ReencaminharAposEmSegundos: {{ .Values.origens.reencaminharAposEmSegundos | quote }}
