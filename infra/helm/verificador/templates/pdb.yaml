apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "verificador.name" . }}
  labels:
    {{- include "verificador.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "verificador.selectorLabels" . | nindent 6 }}
