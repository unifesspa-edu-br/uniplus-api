{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "verificador.minioSecretName" . }}
  labels:
    {{- include "verificador.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ include "verificador.minioSecretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.minio.vaultPath }}
        property: {{ .Values.externalSecrets.minio.accessKey }}
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.minio.vaultPath }}
        property: {{ .Values.externalSecrets.minio.secretKey }}
{{- end }}
