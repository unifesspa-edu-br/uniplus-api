apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-uniplus-config
  labels:
    app: {{ .Release.Name }}-uniplus-api
    app.kubernetes.io/name: uniplus-api
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.env.ASPNETCORE_ENVIRONMENT }}
  ASPNETCORE_URLS: {{ .Values.env.ASPNETCORE_URLS }}
  {{- range $index, $origin := .Values.cors.allowedOrigins }}
  Cors__AllowedOrigins__{{ $index }}: {{ $origin | quote }}
  {{- end }}
  {{- range $index, $network := .Values.reverseProxy.trustedNetworks }}
  ReverseProxy__TrustedNetworks__{{ $index }}: {{ $network | quote }}
  {{- end }}
  AcervoPublico__Bucket: {{ .Values.acervoPublico.bucket | quote }}
  AcervoPublico__EnderecoBase: {{ .Values.acervoPublico.enderecoBase | quote }}
  Geo__BaseUrl: {{ .Values.geo.baseUrl | quote }}
  Geo__OAuth__TokenEndpoint: {{ .Values.geo.oauthTokenEndpoint | quote }}
  Geo__OAuth__ClientId: {{ .Values.geo.oauthClientId | quote }}
  Clamd__Host: {{ .Values.clamd.host | quote }}
  Clamd__Port: {{ .Values.clamd.port | quote }}
  Sigaa__BaseUrl: {{ .Values.sigaa.baseUrl | quote }}
  Discentes__GatilhoDiario__Horario: {{ .Values.discentes.gatilhoDiario.horario | quote }}
  Discentes__GatilhoDiario__FusoHorarioId: {{ .Values.discentes.gatilhoDiario.fusoHorarioId | quote }}
  Discentes__GatilhoDiario__HorarioLimiteAlerta: {{ .Values.discentes.gatilhoDiario.horarioLimiteAlerta | quote }}
  Discentes__GatilhoDiario__FusoHorarioAlertaId: {{ .Values.discentes.gatilhoDiario.fusoHorarioAlertaId | quote }}
  Discentes__GatilhoDiario__CanalAlerta: {{ .Values.discentes.gatilhoDiario.canalAlerta | quote }}
  Discentes__GatilhoDiario__PrazoReatribuicaoSegundos: {{ .Values.discentes.gatilhoDiario.prazoReatribuicaoSegundos | quote }}
  {{- range $index, $segundos := .Values.discentes.gatilhoDiario.retryAposSegundos }}
  Discentes__GatilhoDiario__RetryAposSegundos__{{ $index }}: {{ $segundos | quote }}
  {{- end }}
