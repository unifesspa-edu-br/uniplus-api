apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-uniplus-config
  labels:
    app: {{ .Release.Name }}-uniplus-api
    app.kubernetes.io/name: uniplus-api
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  ASPNETCORE_ENVIRONMENT: {{ .Values.env.ASPNETCORE_ENVIRONMENT }}
  ASPNETCORE_URLS: {{ .Values.env.ASPNETCORE_URLS }}
  {{- range $index, $origin := .Values.cors.allowedOrigins }}
  Cors__AllowedOrigins__{{ $index }}: {{ $origin | quote }}
  {{- end }}
  {{- with .Values.registroDeAcesso.kafka }}
  {{- if .bootstrapServers }}
  RegistroDeAcesso__Kafka__BootstrapServers: {{ .bootstrapServers | quote }}
  {{- end }}
  RegistroDeAcesso__Kafka__Topico: {{ .topico | quote }}
  {{- if .securityProtocol }}
  RegistroDeAcesso__Kafka__SecurityProtocol: {{ .securityProtocol | quote }}
  {{- end }}
  {{- if .saslMechanism }}
  RegistroDeAcesso__Kafka__SaslMechanism: {{ .saslMechanism | quote }}
  {{- end }}
  {{- if .prazoDeConfirmacao }}
  RegistroDeAcesso__Kafka__PrazoDeConfirmacao: {{ .prazoDeConfirmacao | quote }}
  {{- end }}
  {{- if .caminhoDoCertificadoCa }}
  RegistroDeAcesso__Kafka__CaminhoDoCertificadoCa: {{ .caminhoDoCertificadoCa | quote }}
  {{- end }}
  {{- end }}
  {{- range $index, $network := .Values.reverseProxy.trustedNetworks }}
  ReverseProxy__TrustedNetworks__{{ $index }}: {{ $network | quote }}
  {{- end }}
  AcervoPublico__Bucket: {{ .Values.acervoPublico.bucket | quote }}
  AcervoPublico__EnderecoBase: {{ .Values.acervoPublico.enderecoBase | quote }}
  Autorizacao__EnderecoDaConfiguracao: {{ .Values.autorizacao.enderecoDaConfiguracao | quote }}
  Geo__BaseUrl: {{ .Values.geo.baseUrl | quote }}
  Geo__OAuth__TokenEndpoint: {{ .Values.geo.oauthTokenEndpoint | quote }}
  Geo__OAuth__ClientId: {{ .Values.geo.oauthClientId | quote }}
  ArquivosDoCandidato__BucketDeEnvio: {{ .Values.arquivosDoCandidato.bucketDeEnvio | quote }}
  ArquivosDoCandidato__BucketDefinitivo: {{ .Values.arquivosDoCandidato.bucketDefinitivo | quote }}
  Email__Smtp__Host: {{ .Values.email.smtp.host | quote }}
  Email__Smtp__Porta: {{ .Values.email.smtp.porta | quote }}
  Email__Smtp__Seguranca: {{ .Values.email.smtp.seguranca | quote }}
  Email__Smtp__Remetente: {{ .Values.email.smtp.remetente | quote }}
  Email__Smtp__NomeRemetente: {{ .Values.email.smtp.nomeRemetente | quote }}
  Email__Smtp__TempoLimiteDeConexao: {{ .Values.email.smtp.tempoLimiteDeConexao | quote }}
  Email__Smtp__TempoLimiteDeEnvio: {{ .Values.email.smtp.tempoLimiteDeEnvio | quote }}
  Email__Smtp__EnviosSimultaneos: {{ .Values.email.smtp.enviosSimultaneos | quote }}
  Selecao__ReconciliacaoDaVerificacao__Prazo: {{ .Values.reconciliacaoDaVerificacao.prazo | quote }}
  Selecao__ReconciliacaoDaVerificacao__Intervalo: {{ .Values.reconciliacaoDaVerificacao.intervalo | quote }}
  Selecao__ReconciliacaoDaVerificacao__TamanhoDoLote: {{ .Values.reconciliacaoDaVerificacao.tamanhoDoLote | quote }}
