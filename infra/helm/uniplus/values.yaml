replicaCount: 2

image:
  repository: registry.unifesspa.edu.br/uniplus/uniplus-api
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi

env:
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080

# Origens confiáveis para a política de CORS. Em ASPNETCORE_ENVIRONMENT
# diferente de Development, AddCorsConfiguration().ValidateOnStart() rejeita
# lista vazia — sem ao menos uma entrada o pod crashloopa no startup.
# Cada item vira a env var Cors__AllowedOrigins__<i> via ConfigMap.
cors:
  allowedOrigins: []

# Acervo publico (ADR-0132): bucket dedicado ao documento de ato publicado, de
# leitura anonima de objeto, e o endereco pelo qual a borda o serve. O link de
# download divulgado no contrato publico e enderecoBase + chave do objeto.
# Fora de Development, AddUniPlusAcervoPublico().ValidateOnStart() rejeita
# enderecoBase vazio ou sem https — sem ele o pod crashloopa no startup.
# enderecoBase e o nome da borda, nunca a porta de dados do MinIO. A aplicacao
# nao cria o bucket nem aplica politica: ambos sao provisionados pela infra.
# Viram as env vars AcervoPublico__Bucket e AcervoPublico__EnderecoBase.
acervoPublico:
  bucket: uniplus-acervo-publico
  enderecoBase: ""

# Avisos por e-mail do pedido de concessão de acesso: enderecoDaConfiguracao é a URL absoluta (http ou https) da
# aplicação Configuração, onde o link do e-mail abre o pedido (ex.: https://uniplus-hml.unifesspa.edu.br/configuracao).
# Obrigatório — vazio ou sem esquema http(s), o pod crashloopa no startup. Vira Autorizacao__EnderecoDaConfiguracao.
autorizacao:
  enderecoDaConfiguracao: ""

# Redes de onde o proxy que termina o TLS alcanca a aplicacao, em notacao CIDR.
# Fora de Development, AddReverseProxyConfiguration().ValidateOnStart() rejeita
# lista vazia — sem ao menos uma entrada o pod crashloopa no startup.
# So X-Forwarded-Proto e honrado, e apenas vindo destas redes: sem isso a
# aplicacao enxerga http atras do TLS terminado e emite Link e Location com o
# scheme errado. Cada item vira a env var ReverseProxy__TrustedNetworks__<i>.
reverseProxy:
  trustedNetworks: []

# Conferência do endereço do candidato no Geo (issue #1865, ADR-0136): baseUrl é
# obrigatório — AddGeoClient().ValidateOnStart() rejeita vazio, sem ele o pod
# crashloopa no startup, em qualquer ASPNETCORE_ENVIRONMENT. OAuth reaproveita o
# client M2M já provisionado para o Schema Registry (uniplus-api-selecao,
# uniplus-infra#163) — tokenEndpoint e clientId não são segredo (vão aqui);
# clientSecret vai em secrets.geoOAuthClientSecret, provisionado pela infra.
# Viram Geo__BaseUrl / Geo__OAuth__TokenEndpoint / Geo__OAuth__ClientId.
geo:
  baseUrl: ""
  oauthTokenEndpoint: ""
  oauthClientId: ""

# Arquivos do candidato (ADR-0146): o PUT pré-assinado vai ao bucket de envio (quarentena) e a leitura sai do
# definitivo, onde só o verificador promove. Os nomes são obrigatórios — sem eles o pod falha no startup. A cifra
# (SSE-KMS) e as permissões dos buckets são da infraestrutura. Viram ArquivosDoCandidato__BucketDeEnvio e
# ArquivosDoCandidato__BucketDefinitivo. A credencial própria dos dois buckets (a geral enxerga todos, e a API não
# lê o de envio) vem do Vault, em secrets.arquivosDoCandidatoAccessKey / SecretKey.
arquivosDoCandidato:
  bucketDeEnvio: uniplus-candidato-envio
  bucketDefinitivo: uniplus-candidato-definitivo

# Reconciliação do que ficou em verificação sem resultado: prazo contado da última publicação do pedido (precisa
# passar do tempo de fila no pico), intervalo entre execuções e tamanho do lote. Viram
# Selecao__ReconciliacaoDaVerificacao__Prazo / __Intervalo / __TamanhoDoLote.
reconciliacaoDaVerificacao:
  prazo: "00:10:00"
  intervalo: "00:01:00"
  tamanhoDoLote: 100

# Relay de e-mail institucional (issue #2138): host, porta e remetente sao obrigatorios —
# AddEnvioDeEmail().ValidateOnStart() rejeita vazio, sem eles o pod crashloopa no startup.
# seguranca: Nenhuma | StartTls | TlsImplicito. Usuario e senha, quando o relay exige autenticacao,
# vao em secrets.emailSmtpUsuario / emailSmtpSenha (informados juntos). Viram Email__Smtp__Host /
# __Porta / __Seguranca / __Remetente / __NomeRemetente.
email:
  smtp:
    host: ""
    porta: 587
    seguranca: StartTls
    remetente: ""
    nomeRemetente: "Uni+"

# Chaves esperadas no Secret externo `{{ .Release.Name }}-uniplus-secrets`
# (provisionado pelo RUNBOOK do uniplus-infra — NÃO renderizado por este chart).
# O monólito usa as connection strings dos módulos apontando para o MESMO banco `uniplus`
# (schema-por-módulo). Documentadas aqui para rastreabilidade:
secrets:
  uniPlusDbConnection: ""        # ConnectionStrings__UniPlusDb (outbox Wolverine + health)
  configuracaoDbConnection: ""   # ConnectionStrings__ConfiguracaoDb
  organizacaoDbConnection: ""    # ConnectionStrings__OrganizacaoDb
  selecaoDbConnection: ""        # ConnectionStrings__SelecaoDb
  ingressoDbConnection: ""       # ConnectionStrings__IngressoDb
  publicacoesDbConnection: ""    # ConnectionStrings__PublicacoesDb
  autorizacaoDbConnection: ""    # ConnectionStrings__AutorizacaoDb
  redisConnection: ""            # Redis__ConnectionString
  kafkaBootstrapServers: ""      # Kafka__BootstrapServers
  storageEndpoint: ""            # Storage__Endpoint (cluster-local, ex.: minio.uniplus.svc.cluster.local:9000)
  storageAccessKey: ""           # Storage__AccessKey
  storageSecretKey: ""           # Storage__SecretKey
  # Endpoint alcançável de fora do cluster (browser), usado só para assinar
  # URLs pre-assinadas devolvidas a clientes externos (upload/download direto
  # — ver Story #759 T3). Sem preencher, a API cai para storageEndpoint e as
  # URLs devolvidas ao cliente ficam com um host só o pod resolve.
  storagePublicEndpoint: ""      # Storage__PublicEndpoint
  storagePublicUseSsl: ""        # Storage__PublicUseSSL ("true"/"false" — opcional, cai para o mesmo de Storage__UseSSL)
  # Conexão do RabbitMQ (obrigatória): a fila de trabalho da verificação dos arquivos do candidato. Vem do secret
  # `rabbitmq-api` (chave RABBITMQ_URI, vhost `verificacao`), com as credenciais embutidas na URI.
  rabbitMqUri: ""                # RabbitMq__Uri
  # Credencial própria dos buckets do candidato, do Vault em secret/standalone/minio/arquivos-candidato-api
  # (access_key, secret_key), pelo mesmo ExternalSecret das demais chaves deste Secret.
  arquivosDoCandidatoAccessKey: ""  # ArquivosDoCandidato__AccessKey
  arquivosDoCandidatoSecretKey: ""  # ArquivosDoCandidato__SecretKey
  # Credencial do relay de e-mail, do Vault pelo mesmo ExternalSecret das demais chaves. Opcionais: sem
  # autenticacao no relay, ficam fora do Secret.
  emailSmtpUsuario: ""           # Email__Smtp__Usuario
  emailSmtpSenha: ""             # Email__Smtp__Senha
  authAuthority: ""              # Auth__Authority
  # Criptografia de PII (LGPD): AddUniPlusEncryption valida no startup
  # (ValidateOnStart) — SEM estas chaves o host crasha no boot antes de servir.
  # Provider "local" exige LocalKey; "vault" exige os campos Vault
  # (UniPlus__Encryption__VaultAddress / __VaultRole / __VaultTransitMount / ...).
  encryptionProvider: ""         # UniPlus__Encryption__Provider ("local" ou "vault")
  encryptionLocalKey: ""         # UniPlus__Encryption__LocalKey (obrigatória quando Provider=local)
  geoOAuthClientSecret: ""       # Geo__OAuth__ClientSecret (issue #1865) — secret do client M2M uniplus-api-selecao (uniplus-infra#163)

healthcheck:
  # Liveness usa endpoint dependency-free (sem checks externos) para evitar
  # restart loops quando OIDC/DB/Kafka oscilam — apenas confirma que o
  # processo .NET continua respondendo. Readiness usa o /health agregado
  # com todos os checks (OIDC, Postgres, Kafka, Redis), removendo o pod
  # do Service quando dependência transitória cai sem reiniciá-lo.
  livenessPath: /health/live
  readinessPath: /health
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
