# Origem única para a documentação navegável da API.
#
# A UI roda no navegador: quem busca os documentos OpenAPI e dispara o "Try it
# out" é a página, não o container. Servir a interface numa porta e a API em
# outra são origens distintas, e a API não emite `Access-Control-Allow-Origin`
# — o fetch morre em CORS antes de chegar ao servidor. Reunindo interface,
# documentos e API sob o mesmo host o problema deixa de existir, sem afrouxar
# CORS na API por causa de uma ferramenta de desenvolvimento.

server {
    listen 8080;
    server_name _;

    # Documentos do host consolidado: selecao, configuracao, organizacao,
    # publicacoes e ingresso.
    location /openapi/ {
        proxy_pass http://uniplus-api:8080/openapi/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal é deployable autônomo, com documento próprio. Prefixo distinto
    # para não colidir com os do host.
    location /openapi-portal/ {
        proxy_pass http://portal-api:8080/openapi/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # É por aqui que o "Try it out" chama a API — mesma origem da página, com o
    # Authorization que o botão Authorize injeta.
    location /api/ {
        proxy_pass http://uniplus-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /health/ {
        proxy_pass http://uniplus-api:8080/health/;
    }

    location / {
        proxy_pass http://openapi-ui:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
