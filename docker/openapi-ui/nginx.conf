# Origem única para a documentação navegável da API.
#
# A UI roda no navegador: quem busca os documentos OpenAPI e dispara o "Try it
# out" é a página, não o container. Servir a interface numa porta e a API em
# outra são origens distintas, e a API não emite `Access-Control-Allow-Origin`
# — o fetch morre em CORS antes de chegar ao servidor. Reunindo interface,
# documentos e API sob o mesmo host o problema deixa de existir, sem afrouxar
# CORS na API por causa de uma ferramenta de desenvolvimento.

server {
    listen 8080;
    server_name _;

    # DNS embutido do Docker. Sem ele o Nginx resolve os nomes dos serviços uma
    # única vez, ao carregar a configuração, e guarda o IP: recriar `uniplus-api`
    # (o que `up -d --build` faz a cada iteração) troca o IP do container e a
    # documentação passa a devolver 502 — sem o Nginx ficar unhealthy, então nem
    # o `restart` o recupera. `resolver` + hostname em variável adiam a
    # resolução para cada requisição.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $host_api "uniplus-api:8080";
    set $host_ui  "openapi-ui:8080";
    set $portal   "portal-api:8080";

    # `$request_uri` explícito em todo proxy_pass, e não o path literal: assim que
    # o destino contém variável, o Nginx deixa de reescrever o prefixo da location
    # automaticamente — passar `/openapi/` como URI faria toda requisição chegar à
    # API como `/openapi/`, sem o nome do documento, e devolver 404.
    #
    # `Host $http_host` (com a porta), e não `$host`: o ASP.NET monta o `Location`
    # absoluto de um 201 a partir do host recebido. Com a porta descartada, criar
    # um recurso pelo "Try it out" devolveria um link para `http://localhost/api/…`,
    # que não existe — a documentação está em :5299.

    # Documentos do host consolidado: selecao, configuracao, organizacao,
    # publicacoes e ingresso.
    location /openapi/ {
        proxy_pass http://$host_api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Portal é deployable autônomo, com documento próprio. Prefixo distinto aqui
    # para não colidir com os do host; o `rewrite` o traduz de volta para o path
    # real antes de encaminhar.
    location /openapi-portal/ {
        rewrite ^/openapi-portal/(.*)$ /openapi/$1 break;
        proxy_pass http://$portal;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TUDO que o documento do Portal invoca passa por aqui — é o servidor que
    # aquele documento anuncia (`.../portal`). Rotear o Portal por path não
    # bastaria: `/api/auth/me` e `/api/profile/me` existem nos DOIS processos,
    # com o mesmo path, e cairiam no monólito; a chamada responderia 200 tendo
    # exercitado o processo errado, o que é pior que falhar.
    location /portal/ {
        rewrite ^/portal/(.*)$ /$1 break;
        proxy_pass http://$portal;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Split por path equivalente ao do gateway Traefik, para quem chama a rota do
    # Portal diretamente em vez de pelo documento.
    location /api/portal/ {
        proxy_pass http://$portal$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # É por aqui que o "Try it out" chama o host consolidado, na mesma origem da
    # página, com o Authorization que o botão Authorize injeta.
    location /api/ {
        proxy_pass http://$host_api$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location /health/ {
        proxy_pass http://$host_api$request_uri;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://$host_ui$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
