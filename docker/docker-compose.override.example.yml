# Template do override de DESENVOLVIMENTO COMPLETO (copie para docker-compose.override.yml, que é gitignored).
# Só é necessário para o stack completo: acrescenta ao docker-compose.yml o Portal, a documentação OpenAPI,
# o gateway Traefik e os 4 frontends Angular conteinerizados. A infraestrutura, a API do monólito, o Geo, o
# verificador de arquivos e o serviço `ambiente-init` já estão no docker-compose.yml e sobem só com o `.env`:
#   cp docker/.env.example docker/.env
#   cd docker && docker compose up --build
#
# Stack completo (a partir de docker/, com o .env copiado):
#   cp docker-compose.override.example.yml docker-compose.override.yml
#   docker compose up --build
#
# Pré-requisito: `uniplus-api` e `uniplus-web` clonados lado a lado em `repositories/` — o build dos
# frontends usa `context: ../../uniplus-web`. Volume Keycloak limpo na primeira subida (o `--import-realm` não
# reimporta um realm já existente); se você já tinha o stack no ar antes, rode uma vez:
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml down -v --remove-orphans
#
# Topologia (o que este arquivo acrescenta):
#   * portal-api  — Portal (deploy autônomo, banco `uniplus_portal`).
#   * traefik     — gateway :5000 (o `apiUrl` único que os frontends consomem); split geo/portal/monólito.
#   * *-web       — selecao :4200, ingresso :4201, portal :4202, configuracao :4203 (nginx unprivileged :8080).
#
# Auth: as APIs validam o realm `unifesspa` (onde vivem os clients `*-web` do frontend).
# Para smoke/Newman (password grant no realm `unifesspa-dev-local`), adicione o override
# `-f docker-compose.smoke.yml` (ver o cabeçalho daquele arquivo).
services:
  keycloak:
    # Override do compose canônico para importar ADICIONALMENTE o realm
    # `unifesspa-dev-local` — variante de conveniência para smoke local
    # (clients com directAccessGrantsEnabled, audience mapper para `uniplus`,
    # senha do admin não-temporária e requiredActions vazias). Consumido pelo
    # override `docker-compose.smoke.yml`. O realm canônico `unifesspa` (de
    # realm-export.json) continua importado em paralelo, sem perda de funcionalidade.
    volumes:
      - ./keycloak/realm-export-dev-local.json:/opt/keycloak/data/import/realm-export-dev-local.json

  # Com o proxy da documentação (openapi-docs) no ar, o documento da API anuncia o proxy, e não a
  # própria porta, como primeiro servidor.
  uniplus-api:
    environment:
      UniPlus__OpenApi__LocalServerUrl: "http://localhost:${OPENAPI_DOCS_PORT:-5299}"

  portal-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.portal
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PortalDb: "Host=postgres;Port=5432;Database=uniplus_portal;Username=${POSTGRES_USER:?defina POSTGRES_USER no docker/.env};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no docker/.env}"
      Redis__ConnectionString: "redis:6379"
      Kafka__BootstrapServers: "kafka:29092"
      Storage__Endpoint: "minio:9000"
      Storage__AccessKey: "${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no docker/.env}"
      Storage__SecretKey: "${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no docker/.env}"
      Auth__Authority: "http://keycloak:8080/realms/unifesspa"
      # Mesmo motivo do host consolidado, com um prefixo próprio: o Portal expõe
      # /health e demais rotas de infraestrutura com o MESMO path do monólito, então rotear por
      # path mandaria essas chamadas ao processo errado — respondendo 200 sem ter
      # passado por aqui. Sob /portal, tudo que o documento do Portal invoca chega a
      # este processo, seja qual for o path da operação.
      UniPlus__OpenApi__LocalServerUrl: "http://localhost:${OPENAPI_DOCS_PORT:-5299}/portal"
      # Origens da página pública do certame (ADR-0131): Seleção e Publicações são
      # servidos pelo monólito, consultados sem credencial pela rede interna do compose.
      Origens__SelecaoBaseUrl: "http://uniplus-api:8080"
      Origens__PublicacoesBaseUrl: "http://uniplus-api:8080"
    ports:
      - "${PORTAL_API_PORT:-5302}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Keycloak sobe junto da API (a API valida JWT contra o realm unifesspa).
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Documentação navegável dos seis documentos OpenAPI (cinco do host + Portal), em
  # http://localhost:5299. O host registra MapOpenApi e nada além: desde o .NET 9 o
  # Microsoft.AspNetCore.OpenApi gera o documento mas não serve interface, então a UI é
  # escolha de quem hospeda. O botão Authorize aceita o JWT do Keycloak e o envia no
  # "Try it out" — o documento declara o esquema Bearer, e cada rota protegida referencia
  # esse esquema.
  #
  # Só de desenvolvimento: não há equivalente em HML/PROD.
  openapi-ui:
    image: swaggerapi/swagger-ui:v5.29.4
    restart: unless-stopped
    environment:
      # URLs relativas de propósito: quem as busca é o navegador, e a página vem do nginx
      # abaixo. Endereço absoluto para outra porta cairia em CORS.
      URLS: >-
        [
          {"url":"/openapi/selecao.json","name":"Seleção"},
          {"url":"/openapi/configuracao.json","name":"Configuração"},
          {"url":"/openapi/organizacao.json","name":"Organização Institucional"},
          {"url":"/openapi/publicacoes.json","name":"Publicações"},
          {"url":"/openapi/ingresso.json","name":"Ingresso"},
          {"url":"/openapi-portal/portal.json","name":"Portal"}
        ]
      URLS_PRIMARY_NAME: "Seleção"
      DEEP_LINKING: "true"
      DISPLAY_REQUEST_DURATION: "true"
      TRY_IT_OUT_ENABLED: "true"
      PERSIST_AUTHORIZATION: "true"
    expose:
      - "8080"

  openapi-docs:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./openapi-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${OPENAPI_DOCS_PORT:-5299}:8080"
    depends_on:
      - openapi-ui

  # Gateway de DEV (absorvido do antigo docker-compose.frontend-test.yml). Os frontends
  # consomem um único `apiUrl` (http://localhost:5000); o Traefik apenas SEPARA o tráfego
  # das 3 APIs sem reescrever paths (regras em ./traefik/dynamic.yml): /api/{cidades,
  # estados,cep,logradouros} -> geo-api; /api/portal/* -> portal-api; resto -> monólito.
  # Espelha o split geo/portal/monólito do ingress de HML/PROD (K8s).
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --log.level=INFO
    ports:
      - "${GATEWAY_PORT:-5000}:80"     # gateway consumido pelos frontends (apiUrl=http://localhost:5000)
      - "${GATEWAY_DASHBOARD_PORT:-5080}:8080"   # dashboard do Traefik -> http://localhost:5080/dashboard/
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      uniplus-api:
        condition: service_healthy
      geo-api:
        condition: service_healthy
      portal-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Frontends Angular conteinerizados (build web via Docker, cross-repo). O Dockerfile
  # de produção sobrescreve o runtime-config por placeholders `.invalid` (falha rápido
  # sem ConfigMap, ADR-0020/0021); em dev montamos por cima o runtime-config committed
  # de cada app (apiUrl=gateway :5000, issuer=realms/unifesspa, clientId=<app>-web).
  # As portas host (4200-4203) batem os redirectUris/webOrigins dos clients `*-web`.
  selecao-web:
    build:
      context: ../../uniplus-web
      dockerfile: docker/Dockerfile.selecao
    restart: unless-stopped
    volumes:
      - ../../uniplus-web/apps/selecao/public/assets/runtime-config.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    ports:
      - "${SELECAO_WEB_PORT:-4200}:8080"
    depends_on:
      traefik:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ingresso-web:
    build:
      context: ../../uniplus-web
      dockerfile: docker/Dockerfile.ingresso
    restart: unless-stopped
    volumes:
      - ../../uniplus-web/apps/ingresso/public/assets/runtime-config.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    ports:
      - "${INGRESSO_WEB_PORT:-4201}:8080"
    depends_on:
      traefik:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  portal-web:
    build:
      context: ../../uniplus-web
      dockerfile: docker/Dockerfile.portal
    restart: unless-stopped
    volumes:
      - ../../uniplus-web/apps/portal/public/assets/runtime-config.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    ports:
      - "${PORTAL_WEB_PORT:-4202}:8080"
    depends_on:
      traefik:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  configuracao-web:
    build:
      context: ../../uniplus-web
      dockerfile: docker/Dockerfile.configuracao
    restart: unless-stopped
    volumes:
      - ../../uniplus-web/apps/configuracao/public/assets/runtime-config.json:/usr/share/nginx/html/assets/runtime-config.json:ro
    ports:
      - "${CONFIGURACAO_WEB_PORT:-4203}:8080"
    depends_on:
      traefik:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
