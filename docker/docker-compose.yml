services:
  postgres:
    # Imagem PostGIS (superset de postgres:18) — estreia do eixo geoespacial do
    # módulo Geo (ADR-0091). Mantém todas as extensões já usadas pelos demais
    # bancos (pg_trgm, unaccent, btree_gist, uuid-ossp) sem regressão.
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no docker/.env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no docker/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?defina POSTGRES_USER no docker/.env}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.2.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:${KAFKA_PORT:-9092}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    ports:
      # O listener do host usa a mesma porta dentro e fora do contêiner: o broker a anuncia ao cliente.
      - "${KAFKA_PORT:-9092}:${KAFKA_PORT:-9092}"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:${KAFKA_PORT:-9092} | grep -q Cluster"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Cria o tópico do registro de acesso: o produtor da API não cria tópico (ADR-0014: auto-provision só em dev/test).
  kafka-init:
    image: apache/kafka:4.2.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
      --topic autorizacao_registros_de_acesso --partitions 1 --replication-factor 1

  minio:
    image: ghcr.io/unifesspa-edu-br/minio:RELEASE.2025-09-07T16-13-09Z@sha256:52dfd5c0bbd38d3219f2058c7af216d9f9a27a994b7b5baad09bbd38866015ff
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no docker/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no docker/.env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Cria o bucket do acervo público (ADR-0132) e aplica a política de leitura anônima só de
  # objeto, sem listagem, de docker/minio/acervo-publico.policy.json. A aplicação nunca cria esse
  # bucket. Só do ambiente local e dos testes: em homologação e produção o bucket e a política são
  # da infraestrutura, com a leitura anônima restrita à borda. A imagem do servidor já traz o
  # cliente mc — a imagem própria do mc deixou de ser servida publicamente.
  minio-init:
    image: ghcr.io/unifesspa-edu-br/minio:RELEASE.2025-09-07T16-13-09Z@sha256:52dfd5c0bbd38d3219f2058c7af216d9f9a27a994b7b5baad09bbd38866015ff
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no docker/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no docker/.env}
    volumes:
      - ./minio/acervo-publico.policy.json:/politicas/acervo-publico.policy.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/uniplus-candidato-envio &&
        (mc ilm rule list local/uniplus-candidato-envio | grep -q . || mc ilm rule add --expire-days 1 local/uniplus-candidato-envio) &&
        mc mb --ignore-existing local/uniplus-candidato-definitivo &&
        mc mb --ignore-existing local/uniplus-acervo-publico &&
        mc anonymous set-json /politicas/acervo-publico.policy.json local/uniplus-acervo-publico

  # Fila de trabalho da verificação dos arquivos do candidato (ADR-0146): a API publica os pedidos e consome os
  # resultados em quorum queues. Só o ambiente local: em homologação o RabbitMQ é da infraestrutura.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-uniplus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-uniplus_dev}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Servidor de captura de e-mail (SMTP 1025, interface em http://localhost:8025). Só o ambiente
  # local e os testes: nada sai para a internet, a caixa fica visível na interface.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  openldap:
    # OpenLDAP local com dados sintéticos (4devs) para reproduzir o cenário
    # do LDAP institucional Unifesspa em ambiente de desenvolvimento.
    # Usado para testar Identity Brokering com gov.br + matching de CPF
    # contra users LDAP-federados (incluindo casos de CPF com zero à esquerda
    # truncado, bug histórico do brPersonCPF institucional).
    # Ver issue uniplus-api#217 e ADR-029.
    #
    # Imagem: osixia/openldap (não recebe updates desde 2021 mas é estável e
    # amplamente usada em dev. Bitnami descontinuou bitnami/openldap em 2025).
    # Para dev local com dados sintéticos é suficiente — não usar em PROD.
    image: osixia/openldap:1.5.0
    restart: unless-stopped
    command: ["--copy-service", "--loglevel", "info"]
    environment:
      LDAP_ORGANISATION: "Unifesspa Local Sintetico"
      LDAP_DOMAIN: "unifesspa.edu.br"
      LDAP_BASE_DN: "dc=unifesspa,dc=edu,dc=br"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    ports:
      # Mapeamento limitado a 127.0.0.1 — porta NÃO exposta na LAN.
      # Mitiga risco de bind anônimo/credencial fraca (admin/admin) em laptop
      # compartilhado ou rede insegura. Para acesso de outra máquina, usar
      # SSH tunnel (ssh -L 1389:localhost:1389 dev-host).
      # Imagem osixia/openldap:1.5.0 não recebe updates desde 2021 — não é
      # apropriada para PROD; o isolamento por loopback compensa.
      - "127.0.0.1:${LDAP_PORT:-1389}:389"
    volumes:
      - ./ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=unifesspa,dc=edu,dc=br -D 'cn=admin,dc=unifesspa,dc=edu,dc=br' -w admin -s base 'objectClass=*' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    image: ghcr.io/unifesspa-edu-br/uniplus-keycloak:26.7.2
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?defina POSTGRES_USER no docker/.env}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no docker/.env}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      # Canonicaliza o issuer dos tokens para http://localhost:8080 — independente
      # do hostname usado pra acessar o Keycloak (host: localhost; rede docker: keycloak).
      # Sem isso, tokens emitidos via host têm iss=localhost mas a discovery via
      # rede interna retorna iss=keycloak, quebrando a validação JWT nas APIs.
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8080}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?defina KEYCLOAK_ADMIN no docker/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD no docker/.env}
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 1 cat <&3 | grep -q '\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Verificação antivírus dos arquivos do candidato (ADR-0146 e ADR-0147). O clamd escuta só em
  # 127.0.0.1, então o verificador compartilha a rede dele (network_mode). Sem este par o PDF da
  # designação dos gestores nunca é verificado e a instalação não passa do segundo passo. Só o
  # ambiente local: em homologação o par roda como sidecar, publicado pelo pipeline de imagens.
  clamd-verificador:
    build:
      context: ..
      dockerfile: docker/Dockerfile.clamd-verificador
    restart: unless-stopped
    healthcheck:
      # O teste da imagem de origem consulta um socket Unix que a configuração do projeto não abre.
      test: ["CMD-SHELL", "echo PING | timeout 3 nc 127.0.0.1 3310 | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 150s

  verificador:
    build:
      context: ..
      dockerfile: docker/Dockerfile.verificador
    restart: unless-stopped
    network_mode: "service:clamd-verificador"
    environment:
      Verificador__Armazenamento__Endpoint: "minio:9000"
      Verificador__Armazenamento__AccessKey: "${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no docker/.env}"
      Verificador__Armazenamento__SecretKey: "${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no docker/.env}"
      Verificador__Armazenamento__BucketEnvios: "uniplus-candidato-envio"
      Verificador__Armazenamento__BucketArquivos: "uniplus-candidato-definitivo"
      Verificador__RabbitMq__Uri: "amqp://${RABBITMQ_USER:-uniplus}:${RABBITMQ_PASSWORD:-uniplus_dev}@rabbitmq:5672"
    depends_on:
      clamd-verificador:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  apicurio:
    # Apicurio Schema Registry — modo Confluent-compat para os clients .NET
    # (Confluent.SchemaRegistry + Wolverine.Kafka.Serialization). Storage em
    # memória para dev local — não é durável entre restarts; em standalone/HML/PROD
    # o Postgres data-host é usado (apps/apicurio-registry chart no uniplus-infra).
    # Endpoint Confluent-compat: http://localhost:8081/apis/ccompat/v7
    # Auth desligada em dev (APICURIO_AUTH_ENABLED=false) — APIs locais usam
    # SchemaRegistry__AuthType=None. ADR-0051.
    image: apicurio/apicurio-registry:3.2.4
    restart: unless-stopped
    environment:
      QUARKUS_HTTP_PORT: "8081"
      APICURIO_STORAGE_KIND: "sql"
      APICURIO_STORAGE_SQL_KIND: "h2"
      APICURIO_AUTH_ENABLED: "false"
      QUARKUS_OIDC_ENABLED: "false"
    ports:
      - "${APICURIO_PORT:-8081}:8081"
    healthcheck:
      # Apicurio 3.x não expõe /q/health/ready nem /health — verificamos a API
      # principal (/apis/registry/v3/system/info) que só retorna 200 quando
      # storage SQL está pronto e o servidor está aceitando requests.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8081 && echo -e 'GET /apis/registry/v3/system/info HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 1 cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # API UniPlus — o MONÓLITO modular (composition root). Co-hospeda os 5 módulos
  # internos num único processo, contra o banco único `uniplus` (schema-por-módulo).
  uniplus-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.host
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # As 6 connection strings apontam para o MESMO banco `uniplus`; cada
      # DbContext usa seu schema (HasDefaultSchema). UniPlusDb é o outbox
      # Wolverine (schema `wolverine`) + health checks agregados. Role única.
      ConnectionStrings__UniPlusDb: "Host=postgres;Port=5432;Database=uniplus;Username=${POSTGRES_USER:?defina POSTGRES_USER no docker/.env};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no docker/.env}"
      ConnectionStrings__ConfiguracaoDb: "Host=postgres;Port=5432;Database=uniplus;Username=${POSTGRES_USER:?defina POSTGRES_USER no docker/.env};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no docker/.env}"
      ConnectionStrings__OrganizacaoDb: "Host=postgres;Port=5432;Database=uniplus;Username=${POSTGRES_USER:?defina POSTGRES_USER no docker/.env};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no docker/.env}"
      ConnectionStrings__SelecaoDb: "Host=postgres;Port=5432;Database=uniplus;Username=${POSTGRES_USER:?defina POSTGRES_USER no docker/.env};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no docker/.env}"
      ConnectionStrings__IngressoDb: "Host=postgres;Port=5432;Database=uniplus;Username=${POSTGRES_USER:?defina POSTGRES_USER no docker/.env};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no docker/.env}"
      ConnectionStrings__PublicacoesDb: "Host=postgres;Port=5432;Database=uniplus;Username=${POSTGRES_USER:?defina POSTGRES_USER no docker/.env};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no docker/.env}"
      ConnectionStrings__AutorizacaoDb: "Host=postgres;Port=5432;Database=uniplus;Username=${POSTGRES_USER:?defina POSTGRES_USER no docker/.env};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no docker/.env}"
      ConnectionStrings__DiscentesDb: "Host=postgres;Port=5432;Database=uniplus;Username=${POSTGRES_USER:?defina POSTGRES_USER no docker/.env};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no docker/.env}"
      # E-mail: o appsettings.Development aponta para localhost; dentro da rede Docker o Mailpit é o serviço mailpit.
      Email__Smtp__Host: "mailpit"
      Redis__ConnectionString: "redis:6379"
      Kafka__BootstrapServers: "kafka:29092"
      # Registro de acesso a dado pessoal: Kafka próprio, independente do transporte do Wolverine acima.
      RegistroDeAcesso__Kafka__BootstrapServers: "kafka:29092"
      # Schema Registry (Apicurio em modo Confluent-compat) — sufixo /apis/ccompat/v7
      # é mandatório (Apicurio 3.x). Auth desligada em dev (AuthType=None default).
      SchemaRegistry__Url: "http://apicurio:8081/apis/ccompat/v7"
      Storage__Endpoint: "minio:9000"
      Storage__AccessKey: "${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no docker/.env}"
      Storage__SecretKey: "${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no docker/.env}"
      # URLs pre-assinadas devolvidas a clientes externos (browser, Postman)
      # precisam de um endpoint alcançável de fora da rede Docker — minio:9000
      # só resolve dentro dela. Porta 9000 já é publicada no host (ver serviço
      # minio), então localhost funciona para quem roda o frontend fora do Docker.
      Storage__PublicEndpoint: "localhost:${MINIO_PORT:-9000}"
      # Credencial dos buckets do candidato; local, a root do MinIO.
      ArquivosDoCandidato__AccessKey: "${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no docker/.env}"
      ArquivosDoCandidato__SecretKey: "${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no docker/.env}"
      # Fila da verificação dos arquivos do candidato (serviço rabbitmq do docker-compose.yml).
      RabbitMq__Uri: "amqp://${RABBITMQ_USER:-uniplus}:${RABBITMQ_PASSWORD:-uniplus_dev}@rabbitmq:5672"
      # Realm `unifesspa` — o mesmo em que os frontends `*-web` autenticam. Para smoke
      # via password grant, o override docker-compose.smoke.yml realinha para dev-local.
      Auth__Authority: "http://keycloak:8080/realms/unifesspa"
      Auth__Audience: "uniplus"
      # Anuncia a própria API como PRIMEIRO servidor do documento — é o que a interface seleciona
      # por padrão. Sem isto o "Try it out" dispara contra a URL de produção: além de falhar em CORS,
      # manda a requisição (e a credencial colada no Authorize) para o ambiente errado. No stack
      # completo, o override de exemplo troca pelo proxy da documentação. Só de desenvolvimento; em
      # HML/PROD a variável não existe e o documento volta a anunciar apenas Produção e Homologação.
      UniPlus__OpenApi__LocalServerUrl: "http://localhost:${API_PORT:-5200}"
      # Links públicos do acervo (edital e anexos publicados) lidos direto da porta de dados do MinIO
      # publicada no host; acompanha MINIO_PORT, senão dois ambientes na mesma máquina misturam links.
      AcervoPublico__EnderecoBase: "http://localhost:${MINIO_PORT:-9000}/uniplus-acervo-publico"
      # Conferência do endereço do candidato no Geo (issue #1865, ADR-0136) — BaseUrl é
      # obrigatório, sem ele a API não sobe. O OAuth usa o client M2M uniplus-api-selecao:
      # em HML/PROD a infra o provisiona (uniplus-infra#163) e o secret vem de Vault/ESO;
      # aqui o scripts/setup-keycloak-dev.sh o cria com o secret de dev do docker/.env.
      Geo__BaseUrl: "http://geo-api:8080"
      Geo__OAuth__TokenEndpoint: "http://keycloak:8080/realms/unifesspa/protocol/openid-connect/token"
      Geo__OAuth__ClientId: "uniplus-api-selecao"
      Geo__OAuth__ClientSecret: "${UNIPLUS_API_SELECAO_CLIENT_SECRET:?defina UNIPLUS_API_SELECAO_CLIENT_SECRET no docker/.env}"
      # Domínios cujo e-mail a instalação dos gestores de acessos aceita (igualdade exata, ADR-0152).
      # Só de desenvolvimento: o admin local é admin@teste.unifesspa.edu.br e as personas fictícias
      # são @uniplus-test.local. Em HML e produção a variável não existe e vale o domínio da instituição.
      Autorizacao__Instalacao__DominiosInstitucionais__0: "unifesspa.edu.br"
      Autorizacao__Instalacao__DominiosInstitucionais__1: "teste.unifesspa.edu.br"
      Autorizacao__Instalacao__DominiosInstitucionais__2: "uniplus-test.local"
    ports:
      - "${API_PORT:-5200}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      apicurio:
        condition: service_healthy
      geo-api:
        condition: service_healthy
      # MinIO entra no /health agregado (readiness) — declarar a dependência evita
      # que a API fique unhealthy quando subida isolada (storage é lazy no uso, mas
      # o health check o pinga no readiness).
      minio:
        condition: service_healthy
      # O acervo público precisa existir, com a política de leitura anônima, antes de a API
      # publicar o primeiro documento nele — a aplicação não o cria. O endereço que os links
      # divulgam vem do appsettings.Development.json (MinIO local, porta 9000).
      minio-init:
        condition: service_completed_successfully
      # Keycloak sobe junto da API (a API valida JWT contra o realm unifesspa).
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Deixa o ambiente pronto depois que a API e o Keycloak sobem: configura o Keycloak (senha do admin, personas
  # fictícias, papel uniplus-instalacao) e instala os dois primeiros gestores de acessos pela API (ADR-0152).
  # Idempotente: com tudo configurado e os gestores instalados, não altera nada e termina com sucesso; banco
  # recriado, refaz tudo. Os scripts entram por volume (scripts/ambiente-init.sh). Só o ambiente local.
  # Acompanhe com `docker compose ... logs -f ambiente-init`; INSTALAR_GESTORES=false pula só a instalação.
  ambiente-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ambiente-init
    restart: "no"
    environment:
      KC_URL: "http://keycloak:8080"
      # O que o navegador do host alcança (KC_HOSTNAME do Keycloak): entra nas URLs de login do gov.br simulado.
      KC_PUBLIC_URL: "http://localhost:${KEYCLOAK_PORT:-8080}"
      API_URL: "http://uniplus-api:8080"
      # O que o host alcança, para os exemplos de validação que o setup do Keycloak imprime.
      API_PUBLIC_URL: "http://localhost:${API_PORT:-5200}"
      MAILPIT_URL: "http://mailpit:8025"
      KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN:?defina KEYCLOAK_ADMIN no docker/.env}"
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?defina KEYCLOAK_ADMIN_PASSWORD no docker/.env}"
      UNIPLUS_API_SELECAO_CLIENT_SECRET: "${UNIPLUS_API_SELECAO_CLIENT_SECRET:?defina UNIPLUS_API_SELECAO_CLIENT_SECRET no docker/.env}"
      CONFIGURACAO_WEB_ORIGIN: "http://localhost:${CONFIGURACAO_WEB_PORT:-4203}"
      # A URL assinada de envio do PDF aponta para o MinIO publicado no host (Storage__PublicEndpoint);
      # aqui dentro ela é redirecionada para o serviço, sem trocar o Host que entra na assinatura.
      ARMAZENAMENTO_CONNECT_TO: "localhost:${MINIO_PORT:-9000}:minio:9000"
      INSTALAR_GESTORES: "${INSTALAR_GESTORES:-true}"
      # Marca o ambiente local do compose: é o que libera o KC_URL http://keycloak:* nas travas DEV ONLY dos scripts.
      AMBIENTE_LOCAL_DOCKER: "true"
      # O que o host alcança, para o exemplo de ldapsearch; o teste de conexão do setup segue em openldap:389.
      LDAP_PUBLIC_URL: "ldap://127.0.0.1:${LDAP_PORT:-1389}"
      LDAP_PROBE_HOST: "openldap"
      LDAP_PROBE_PORT: "389"
    volumes:
      - ../scripts:/repo/scripts:ro
      - ./keycloak:/repo/docker/keycloak:ro
    depends_on:
      keycloak:
        condition: service_healthy
      # A API só precisa estar de pé: o próprio ambiente-init espera o /health por até 5 minutos, mais do que a
      # janela do healthcheck cobre na primeira subida, com as migrations de todos os módulos.
      uniplus-api:
        condition: service_started
      mailpit:
        condition: service_healthy
      # O setup do Keycloak só cria a federação LDAP se o openldap já escuta; sem esperar, o passo é pulado.
      openldap:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      verificador:
        condition: service_started

  # API Geo — deploy autônomo (banco isolado uniplus_geo com PostGIS, ADR-0090/0091).
  # Dono do banco: usuário _app dedicado (uniplus_geo_app), provisionado por init-db.sql.
  # Extraído para repositório dedicado (issue #732, ADR-0099): a imagem do Geo passa
  # a ser publicada por `unifesspa-geo-api`, não mais construída aqui. O serviço
  # permanece no stack local apontando para a imagem publicada, contra o banco
  # `uniplus_geo` que o init-db.sql continua provisionando.
  #
  # O workflow do repo Geo publica tags `sha-<short-sha>` e tags de release (usa
  # `latest=false` — NÃO há tag `latest`). Defina GEO_IMAGE_TAG no seu .env com uma
  # tag Geo publicada concreta (ex.: `GEO_IMAGE_TAG=v1.0.0`) para manter o stack
  # reprodutível — sem isso o compose falha rápido em vez de puxar tag móvel.
  geo-api:
    image: "ghcr.io/unifesspa-edu-br/unifesspa-geo-api:${GEO_IMAGE_TAG:?defina GEO_IMAGE_TAG com uma tag Geo publicada (sha-<short> ou release); o repo nao publica latest}"
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__GeoDb: "Host=postgres;Port=5432;Database=uniplus_geo;Username=uniplus_geo_app;Password=uniplus_dev"
      # Banco de staging da DNE (unifesspa-geo-api#12) — só passa a ter efeito
      # quando GEO_IMAGE_TAG apontar para uma imagem que já inclua a correção.
      ConnectionStrings__GeoStagingDb: "Host=postgres;Port=5432;Database=uniplus_geo_staging;Username=uniplus_geo_staging_app;Password=uniplus_dev"
      Redis__ConnectionString: "redis:6379"
      Kafka__BootstrapServers: "kafka:29092"
      Storage__Endpoint: "minio:9000"
      Storage__AccessKey: "${MINIO_ROOT_USER:?defina MINIO_ROOT_USER no docker/.env}"
      Storage__SecretKey: "${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD no docker/.env}"
      Auth__Authority: "http://keycloak:8080/realms/unifesspa"
      Auth__Audience: "uniplus"
      # O appsettings.Development do Geo não lista todos os frontends locais; a lista
      # inteira vai aqui, para a busca de CEP e de município funcionar em qualquer um.
      Cors__AllowedOrigins__0: "http://localhost:4100"
      Cors__AllowedOrigins__1: "http://localhost:${SELECAO_WEB_PORT:-4200}"
      Cors__AllowedOrigins__2: "http://localhost:${INGRESSO_WEB_PORT:-4201}"
      Cors__AllowedOrigins__3: "http://localhost:${PORTAL_WEB_PORT:-4202}"
      Cors__AllowedOrigins__4: "http://localhost:${CONFIGURACAO_WEB_PORT:-4203}"
      Cors__AllowedOrigins__5: "http://localhost:4300"
    ports:
      - "${GEO_API_PORT:-5400}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data:
  openldap_data:
  openldap_config:
