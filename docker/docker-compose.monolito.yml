# Stack do MONÓLITO MODULAR: valida que o composition root boota como
# UM serviço Docker contra o banco único `uniplus` (schema-por-módulo).
#
# Auto-contida e mínima — Postgres + Redis + Kafka + o monólito. O Kafka serve só ao
# registro de acesso a dado pessoal, que o host exige para subir e publica de forma
# síncrona; o transporte Kafka do Wolverine segue desligado. MinIO/Keycloak são
# omitidos de propósito (storage/OIDC são lazy), e o smoke usa endpoints anônimos.
# A stack completa (mensageria, storage, auth) é trabalho de rollout. Geo segue
# deploy separado.
#
# Uso:
#   docker compose -f docker/docker-compose.monolito.yml up -d --build
# Smoke (boot + roteamento por módulo, sem auth) — host expõe a 28080:
#   curl -fsS http://localhost:28080/health/live
#   curl -fsS http://localhost:28080/api/organizacao/unidades
#   curl -fsS http://localhost:28080/api/configuracao/campi
#   curl -fsS http://localhost:28080/openapi/configuracao.json
# Limpeza (descarta o volume p/ reexecutar o init-db):
#   docker compose -f docker/docker-compose.monolito.yml down -v

name: uniplus-monolito

services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: uniplus
      POSTGRES_PASSWORD: uniplus_dev
      POSTGRES_DB: uniplus
    volumes:
      - postgres_monolito_data:/var/lib/postgresql
      - ./init-db.monolito.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uniplus"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.2.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 | grep -q Cluster"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka-init:
    image: apache/kafka:4.2.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
      --topic autorizacao_registros_de_acesso --partitions 1 --replication-factor 1

  monolito-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.host
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Uma só connection string: UniPlusDb serve ao contexto único dos módulos, ao outbox
      # Wolverine (schema `wolverine`) e aos health checks; cada módulo usa o seu schema.
      ConnectionStrings__UniPlusDb: "Host=postgres;Port=5432;Database=uniplus;Username=uniplus;Password=uniplus_dev"
      Redis__ConnectionString: "redis:6379"
      # Stack mínima sem broker: limpa o Kafka:BootstrapServers do
      # appsettings.Development.json (localhost:9092) para o
      # UseWolverineOutboxCascading manter o transporte Kafka DESLIGADO (só a queue
      # PG) — sem isso o host tentaria UseKafka().AutoProvision() num broker ausente.
      # Espaço em vez de string vazia: em runtimes < .NET 9, vazio apaga a env var.
      Kafka__BootstrapServers: " "
      # Registro de acesso: Kafka próprio, independente do transporte do Wolverine acima.
      RegistroDeAcesso__Kafka__BootstrapServers: "kafka:29092"
      Auth__Authority: "http://localhost/realms/unifesspa"
      Auth__Audience: "uniplus"
      # Sem OTEL collector na stack mínima — desliga o exporter p/ evitar ruído de
      # conexão no boot (independe de qual appsettings vence o co-hosting).
      Observability__Enabled: "false"
    ports:
      - "28080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_monolito_data:
