# clamd do sidecar do verificador (ADR-0146 e ADR-0147). StreamMaxLength e MaxThreads são repetidos na
# configuração do verificador, que os confere na subida.
Foreground yes
LogTime yes
TCPSocket 3310
TCPAddr 127.0.0.1
DatabaseDirectory /var/lib/clamav
IdleTimeout 600

# O verificador processa 4 arquivos em paralelo; a quinta thread atende o PING da probe e o VERSION,
# que de outro modo esperariam atrás das varreduras e fariam a liveness reiniciar o clamd no pico.
MaxThreads 5
MaxRecursion 16
MaxFiles 50000
MaxFileSize 100M
MaxScanSize 400M
StreamMaxLength 25M

HeuristicAlerts yes
ScanArchive yes
ScanMail yes
ScanPE yes
ScanELF yes
ScanPDF yes
ScanXMLDOCS yes
ScanHWP3 yes

# As duas assinaturas de JavaScript em PDF (pua-ignoradas.ign2) recusavam o PDF válido que só ajusta o zoom.
DetectPUA yes
# Arquivo compactado cifrado não pode ser varrido; o PDF protegido só contra edição segue.
AlertEncryptedArchive yes
AlertEncryptedDoc no
# Sem este alerta, o que passa dos limites não é varrido e o clamd responde que está limpo.
AlertExceedsMax yes
# A recarga bloqueante travou o clamd com verificações em andamento.
ConcurrentDatabaseReload yes
